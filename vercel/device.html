<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --primary: #7b5ef8;
  --primary-light: #9b82ff;
  --primary-dark: #5a3fd6;
  --bg: #f5f5ff;
  --card: #ffffff;
  --text: #1a1a2e;
  --text-secondary: #6b6b80;
  --border: rgba(123,94,248,0.12);
  --shadow: 0 2px 16px rgba(123,94,248,0.08);
  --radius: 16px;
  --radius-sm: 10px;
  --success: #00e5a0;
  --warning: #ffab00;
  --danger: #ff4f5e;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
.hidden { display: none !important; }
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }
#loadingScreen { align-items: center; justify-content: center; gap: 20px; min-height: 100vh; }
.loader { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
  border: none; cursor: pointer; transition: all 0.15s; text-decoration: none;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-block { width: 100%; }
.verify-screen { background: var(--card); min-height: 100vh; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; position: fixed; inset: 0; z-index: 999; }
.verify-screen.active { display: flex; }
.verify-card { background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); border-radius: 20px; padding: 32px 24px; width: 100%; max-width: 380px; text-align: center; }
.verify-user { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--bg); border-radius: 14px; border: 1px solid var(--border); margin-bottom: 24px; }
.verify-user img { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover; }
.verify-user .vu-info { flex: 1; text-align: left; }
.verify-user .vu-name { font-weight: 700; font-size: 15px; color: var(--text); }
.verify-user .vu-id { font-size: 11px; color: var(--text-secondary); }
.verify-badge { padding: 5px 14px; border-radius: 20px; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; }
.verify-badge.scanning { background: rgba(123,94,248,0.12); color: var(--primary); border: 1px solid rgba(123,94,248,0.25); }
.verify-badge.verified { background: rgba(0,229,160,0.12); color: var(--success); border: 1px solid rgba(0,229,160,0.25); }
.verify-badge.failed { background: rgba(255,79,94,0.12); color: var(--danger); border: 1px solid rgba(255,79,94,0.25); }
.verify-scanner { width: 140px; height: 140px; margin: 0 auto 24px; position: relative; }
.verify-scanner .ring { position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent; border-top-color: var(--success); border-right-color: var(--primary); animation: verifySpin 1.5s linear infinite; }
.verify-scanner .ring2 { position: absolute; inset: 12px; border-radius: 50%; border: 3px solid transparent; border-bottom-color: var(--primary-light); border-left-color: var(--success); animation: verifySpin 2s linear infinite reverse; }
.verify-scanner .dot { position: absolute; width: 10px; height: 10px; background: var(--primary); border-radius: 50%; top: 0; left: 50%; transform: translateX(-50%); animation: dotMove 1.5s linear infinite; }
@keyframes verifySpin { to { transform: rotate(360deg); } }
@keyframes dotMove { 0% { top: 0; left: 50%; } 25% { top: 50%; left: 100%; } 50% { top: 100%; left: 50%; } 75% { top: 50%; left: 0; } 100% { top: 0; left: 50%; } }
.verify-title { color: var(--primary); font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.verify-sub { color: var(--text-secondary); font-size: 14px; margin-bottom: 20px; }
.verify-progress { width: 100%; height: 4px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
.verify-progress .bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); border-radius: 4px; width: 0%; transition: width 0.3s; animation: progressAnim 3.5s ease-in-out forwards; }
@keyframes progressAnim { 0% { width: 0%; } 30% { width: 40%; } 60% { width: 70%; } 90% { width: 95%; } 100% { width: 100%; } }
.verify-check { width: 100px; height: 100px; margin: 0 auto 20px; border-radius: 50%; background: rgba(0,229,160,0.12); border: 3px solid var(--success); display: flex; align-items: center; justify-content: center; animation: checkPop 0.4s cubic-bezier(0.34,1.56,0.64,1); }
.verify-check.fail { border-color: var(--danger); background: rgba(255,79,94,0.12); }
.verify-check.fail svg { stroke: var(--danger); }
@keyframes checkPop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
.verify-check svg { width: 48px; height: 48px; stroke: var(--success); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.verify-ctitle { color: var(--success); font-size: 22px; font-weight: 800; margin-bottom: 8px; }
.verify-ctitle.fail { color: var(--danger); }
.verify-csub { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
.verify-continue { width: 100%; padding: 16px; border: none; border-radius: 14px; background: linear-gradient(135deg, var(--success), #00c48c); color: #071a11; font-size: 16px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.15s; }
.verify-continue:active { transform: scale(0.97); }
.verify-footer { color: var(--text-secondary); font-size: 11px; margin-top: 20px; }
</style>
</head>
<body>
<div id="loadingScreen" class="screen active">
  <div class="loader"></div>
  <div style="font-weight:700;color:var(--primary);font-size:18px">Verifying...</div>
</div>

<div id="verifyScreen" class="verify-screen">
  <div class="verify-card" id="verifyCard"></div>
  <div class="verify-footer">TaskHub &mdash; Secure Verification</div>
</div>

<script>
function getDeviceFingerprint() {
  var s = navigator.userAgent + '|' + screen.width + 'x' + screen.height + '|' + (navigator.language || '') + '|' + (navigator.platform || '') + '|' + new Date().getTimezoneOffset() + '|' + (navigator.hardwareConcurrency || '');
  var h = 0, i, c;
  for (i = 0; i < s.length; i++) { c = s.charCodeAt(i); h = ((h << 5) - h) + c; h |= 0; }
  return Math.abs(h).toString(16);
}

function playVerifySound() {
  try {
    var ctx = new (window.AudioContext || window.webkitAudioContext)();
    var osc = ctx.createOscillator();
    var g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.15);
    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.3);
    osc.type = 'sine';
    g.gain.setValueAtTime(0.25, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.6);
  } catch (e) {}
}

function apiBase() {
  return window.location.origin || 'https://taskhub-khaki.vercel.app';
}

async function apiFetch(path, options) {
  var controller = new AbortController();
  var timeout = setTimeout(function () { controller.abort(); }, 10000);
  try {
    var res = await fetch(apiBase() + path, Object.assign({ signal: controller.signal }, options || {}));
    return await res.json();
  } finally {
    clearTimeout(timeout);
  }
}

function showVerifyCard(html) {
  var card = document.getElementById('verifyCard');
  if (card) card.innerHTML = html;
}

async function doFullVerification(uid) {
  var vs = document.getElementById('verifyScreen');
  var ls = document.getElementById('loadingScreen');
  var card = document.getElementById('verifyCard');
  if (!vs || !card) return;
  vs.classList.add('active');
  vs.style.display = 'flex';
  if (ls) { ls.classList.remove('active'); ls.style.display = 'none'; }
  showVerifyCard('<div style="text-align:center;padding:32px"><div class="loader" style="margin:0 auto 16px;width:40px;height:40px"></div><div style="font-weight:600">Loading...</div></div>');
  try {
    var d = await apiFetch('/api/user/' + uid);
    var nm = (d.ok && d.user) ? (d.user.first_name || d.user.username || 'User') : 'User';
    var pf = (d.ok && d.user && d.user.pfp_url) ? d.user.pfp_url : '';
    if (!pf) {
      var il = nm.charAt(0).toUpperCase();
      pf = 'data:image/svg+xml,%3Csvg xmlns=\'http://www.w3.org/2000/svg\' viewBox=\'0 0 100 100\'%3E%3Ccircle cx=\'50\' cy=\'50\' r=\'50\' fill=\'%237b5ef8\'/%3E%3Ctext x=\'50\' y=\'68\' text-anchor=\'middle\' fill=\'%23fff\' font-size=\'44\'%3E' + il + '%3C/text%3E%3C/svg%3E';
    }
    var di = 'ID: ' + uid;
    if (d.ok && d.user && d.user.username) di = '@' + d.user.username + ' | ' + uid;
    showVerifyCard(
      '<div class="verify-user"><img src="' + pf + '" alt=""><div class="vu-info"><div class="vu-name">' + nm + '</div><div class="vu-id">' + di + '</div></div><span class="verify-badge scanning">SCANNING</span></div>' +
      '<div class="verify-scanner"><div class="ring"></div><div class="ring2"></div><div class="dot"></div></div>' +
      '<div class="verify-title">Device Verification</div>' +
      '<div class="verify-sub">Verifying your device...</div>' +
      '<div class="verify-progress"><div class="bar"></div></div>'
    );
    var fh = getDeviceFingerprint();
    var re = await apiFetch('/api/verify-device', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device_hash: fh, user_id: parseInt(uid) })
    });
    if (re.ok || re.error === 'already_verified') {
      await new Promise(function (r) { setTimeout(r, 3000); });
      try { playVerifySound(); } catch (e) {}
      showVerifyCard(
        '<div class="verify-check"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></div>' +
        '<div class="verify-ctitle">Device Verified</div>' +
        '<div class="verify-csub">Your device has been verified successfully.</div>' +
        '<button class="verify-continue" onclick="doVerifyContinue(\'' + uid + '\')">CONTINUE</button>'
      );
    } else if (re.error === 'device_linked') {
      showVerifyCard(
        '<div class="verify-check fail"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>' +
        '<div class="verify-ctitle fail">Already Linked</div>' +
        '<div class="verify-csub">This device is already linked to another account. Use that account or contact support.</div>' +
        '<button class="verify-continue" style="background:var(--danger);color:#fff" onclick="location.reload()">TRY AGAIN</button>'
      );
      (function ts() {
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.sendData) {
          window.Telegram.WebApp.sendData(JSON.stringify({ action: 'failed', user_id: parseInt(uid), reason: 'device_linked' }));
        } else { setTimeout(ts, 300); }
      })();
    } else {
      showVerifyCard(
        '<div class="verify-check fail"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>' +
        '<div class="verify-ctitle fail">Verification Failed</div>' +
        '<div class="verify-csub">' + (re.error || 'Unknown error') + '</div>' +
        '<button class="verify-continue" style="background:var(--danger);color:#fff" onclick="location.reload()">RETRY</button>'
      );
    }
  } catch (e) {
    showVerifyCard(
      '<div class="verify-check fail"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></div>' +
      '<div class="verify-ctitle fail">Connection Error</div>' +
      '<div class="verify-csub">Could not reach server. Check your connection and try again.</div>' +
      '<button class="verify-continue" style="background:var(--primary);color:#fff" onclick="location.reload()">RETRY</button>'
    );
  }
  window.__verifyDone = true;
}

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

function showError(msg) {
  switchScreen('loadingScreen');
  document.getElementById('loadingScreen').innerHTML =
    '<div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:12px">&#x274C;</div><h3 style="font-size:16px;margin-bottom:8px">' + msg + '</h3><button class="btn btn-primary" style="margin-top:16px" onclick="location.reload()">RETRY</button></div>';
}

async function doVerifyContinue(userId) {
  try {
    await apiFetch('/api/verification-done', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: parseInt(userId) })
    });
  } catch (e) {}
  var tg = window.Telegram?.WebApp;
  if (tg && tg.close) {
    tg.close();
  } else if (tg && tg.closeWebView) {
    tg.closeWebView();
  } else {
    switchScreen('loadingScreen');
    document.getElementById('loadingScreen').innerHTML =
      '<div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:12px">&#x2705;</div><h3>Verification Complete!</h3><p style="color:var(--text-secondary);margin-top:8px">Go back to Telegram to continue.</p></div>';
  }
}

window.onerror = function (msg, src, line, col, err) {
  var el = document.getElementById('verifyScreen');
  if (el && el.classList.contains('active')) {
    el.innerHTML =
      '<div class="verify-card" style="padding:32px 24px;text-align:center;background:var(--card);border:1px solid var(--border)"><div style="font-size:48px;margin-bottom:12px">&#x274C;</div><h3 style="color:var(--danger);font-size:16px;margin-bottom:8px">Error</h3><p style="color:var(--text-secondary);font-size:12px;word-break:break-word">' + msg + '</p><button class="verify-continue" style="margin-top:16px;background:var(--primary);color:#fff" onclick="location.reload()">RETRY</button></div>';
  } else {
    document.getElementById('loadingScreen').innerHTML =
      '<div style="text-align:center;padding:20px;font-size:12px;color:var(--danger);word-break:break-all"><b>JS Error:</b><br>' + msg + '<br>Line: ' + line + '<br>' + (err && err.stack ? err.stack.split('\n')[1] : '') + '</div>';
  }
  return true;
};

var _initDone = false;

async function init() {
  if (_initDone) return;
  _initDone = true;
  try {
    var tg = window.Telegram?.WebApp;
    tg?.ready();
    tg?.expand();
    var uid = tg?.initDataUnsafe?.user?.id;
    if (uid) {
      doFullVerification(String(uid));
    } else {
      var _p = new URLSearchParams(window.location.search);
      uid = _p.get('user_id');
      if (uid) {
        doFullVerification(uid);
      } else {
        showError('Could not identify user. Please open from Telegram bot.');
      }
    }
  } catch (e) {
    console.error('Device verify init error:', e);
    showError('Something went wrong. Please try again.');
  }
}

setTimeout(function () {
  if (document.getElementById('loadingScreen').classList.contains('active')) {
    var retryBtn = document.querySelector('#loadingScreen .btn-primary');
    if (retryBtn && retryBtn.textContent.includes('Retry')) return;
    showError('Loading timed out. Check connection and retry.');
  }
}, 15000);

init();
</script>
</body>
</html>
