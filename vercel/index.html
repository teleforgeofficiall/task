<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TaskHub</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --primary: #7b5ef8;
  --primary-light: #9b82ff;
  --primary-dark: #5a3fd6;
  --bg: #f5f5ff;
  --card: #ffffff;
  --text: #1a1a2e;
  --text-secondary: #6b6b80;
  --border: rgba(123,94,248,0.12);
  --shadow: 0 2px 16px rgba(123,94,248,0.08);
  --radius: 16px;
  --radius-sm: 10px;
  --success: #00e5a0;
  --warning: #ffab00;
  --danger: #ff4f5e;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}
.hidden { display: none !important; }
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }
/* Loading */
#loadingScreen { align-items: center; justify-content: center; gap: 20px; min-height: 100vh; }
.loader { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
/* Header */
.app-header {
  background: var(--card); padding: 12px 16px; display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
}
.app-header .pfp {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover;
}
.app-header .user-info { flex: 1; min-width: 0; }
.app-header .user-name { font-weight: 700; font-size: 15px; }
.app-header .user-id { font-size: 11px; color: var(--text-secondary); }
.app-header .balance-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 14px;
  cursor: pointer; white-space: nowrap;
}
/* Bottom Nav */
.bottom-nav {
  display: flex; background: #1a1a2e; border-top: 1px solid rgba(255,255,255,0.06);
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  padding: 4px 0 env(safe-area-inset-bottom, 4px) 0;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 0 4px 0; cursor: pointer; color: #6b6b80; font-size: 10px; font-weight: 600;
  transition: color 0.2s; border: none; background: none;
}
.nav-item.active { color: #7b5ef8; }
.nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav-item.active svg { fill: rgba(123,94,248,0.2); stroke: #7b5ef8; }
/* Floating Contact */
.contact-float {
  position: fixed; bottom: 76px; right: 16px; z-index: 101;
  width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, #ff4f5e, #ff6b6b); color: #fff;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(255,79,94,0.4); border: none; cursor: pointer;
  transition: transform 0.2s;
}
.contact-float:active { transform: scale(0.92); }
.contact-float svg { width: 24px; height: 24px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* Tab Content */
.tab-content { flex: 1; padding: 12px 16px 80px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.tab-page { display: none; }
.tab-page.active { display: block; }
/* Cards */
.card {
  background: var(--card); border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 12px;
}
.task-card {
  display: flex; gap: 12px; cursor: pointer; transition: transform 0.15s; position: relative; overflow: hidden;
}
.task-card:active { transform: scale(0.98); }
.task-img {
  width: 90px; height: 90px; border-radius: 14px; object-fit: cover; flex-shrink: 0;
  background: linear-gradient(135deg, var(--primary-light), var(--primary));
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 32px;
}
.task-img img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; }
.task-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.task-info h3 { font-size: 14px; margin-bottom: 3px; font-weight: 700; line-height: 1.2; }
.task-info .reward {
  color: var(--success); font-weight: 800; font-size: 18px; display: inline-block; margin-right: 8px;
}
.task-info .meta { font-size: 11px; color: var(--text-secondary); display: flex; gap: 10px; margin-top: 4px; align-items: center; }
.task-badge {
  display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; text-transform: uppercase;
}
.badge-channel { background: #e8e5ff; color: var(--primary); }
.badge-social { background: #e3f2fd; color: #1976d2; }
.badge-app { background: #e8f5e9; color: #388e3c; }
.badge-survey { background: #fff3e0; color: #f57c00; }
.task-actions { display: flex; gap: 8px; margin-top: 8px; }
.task-btn-video {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px;
  border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer;
  border: 1.5px solid var(--warning); color: var(--warning); background: transparent;
  transition: all 0.15s;
}
.task-btn-video:active { background: var(--warning); color: #fff; }
.task-btn-start {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px;
  border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer;
  border: none; color: #fff; background: var(--primary);
  transition: all 0.15s; flex: 1; justify-content: center;
}
.task-btn-start:active { opacity: 0.85; transform: scale(0.97); }
.task-completed-badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px;
  border-radius: 8px; font-size: 11px; font-weight: 700;
  border: none; color: #fff; background: var(--success);
}
.task-multi-badge {
  display: inline-block; padding: 1px 6px; border-radius: 4px;
  font-size: 9px; font-weight: 700; background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: #fff;
}
.task-reward-col {
  display: flex; flex-direction: column; align-items: flex-end; justify-content: center; flex-shrink: 0;
}
.task-reward-col .reward { color: var(--success); font-weight: 800; font-size: 18px; white-space: nowrap; }
.task-reward-col .meta { font-size: 10px; color: var(--text-secondary); margin-top: 2px; text-align: right; }
/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 700; font-size: 14px;
  border: none; cursor: pointer; transition: all 0.15s; text-decoration: none;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-success { background: var(--success); color: #071a11; }
.btn-outline { background: none; border: 2px solid var(--primary); color: var(--primary); }
.btn-sm { padding: 6px 14px; font-size: 12px; }
.btn-block { width: 100%; }
.btn-ghost { background: var(--bg); color: var(--text-secondary); }
/* Channel Check */
.channel-list { display: flex; flex-direction: column; gap: 10px; }
.channel-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  background: var(--card); border-radius: var(--radius-sm); border: 1px solid var(--border);
}
.channel-item.verified { border-color: var(--success); }
.channel-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--primary); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 20px; }
.channel-info { flex: 1; min-width: 0; }
.channel-info h4 { font-size: 14px; }
.channel-info p { font-size: 11px; color: var(--text-secondary); }
.channel-check { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; }
.channel-check.checked { background: var(--success); border-color: var(--success); color: #fff; font-size: 14px; }
/* Bonus */
.bonus-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; border-radius: var(--radius); padding: 24px; text-align: center; margin-bottom: 12px;
}
.bonus-card h2 { font-size: 24px; margin-bottom: 8px; }
.bonus-card .bonus-amount { font-size: 42px; font-weight: 800; }
.bonus-card .sub { opacity: 0.8; font-size: 14px; margin-top: 4px; }
/* Wallet */
.wallet-header {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; border-radius: var(--radius); padding: 24px; text-align: center; margin-bottom: 12px;
}
.wallet-header .balance { font-size: 36px; font-weight: 800; }
.wallet-header .label { font-size: 13px; opacity: 0.8; margin-top: 4px; }
.withdraw-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.withdraw-opt {
  background: var(--card); border-radius: var(--radius-sm); padding: 16px 12px; text-align: center;
  border: 1px solid var(--border); cursor: pointer; transition: all 0.15s;
}
.withdraw-opt:active { transform: scale(0.96); }
.withdraw-opt svg { width: 28px; height: 28px; stroke: var(--primary); margin-bottom: 6px; }
.withdraw-opt h4 { font-size: 13px; }
.withdraw-opt p { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center;
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-content {
  background: var(--card); border-radius: var(--radius) var(--radius) 0 0; padding: 24px; width: 100%; max-width: 480px;
  max-height: 85vh; overflow-y: auto; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.modal-overlay.open .modal-content { transform: translateY(0); }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; text-align: center; }
.modal-close { position: absolute; top: 12px; right: 16px; font-size: 24px; cursor: pointer; color: var(--text-secondary); background: none; border: none; }
/* Form */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); }
.form-input {
  width: 100%; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
  font-size: 15px; background: var(--bg); color: var(--text); outline: none; transition: border-color 0.2s;
}
.form-input:focus { border-color: var(--primary); }
/* Ads */
.ad-card {
  background: var(--card); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
}
.ad-icon { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #ff6b6b, #ee5a24); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; flex-shrink: 0; }
.ad-info { flex: 1; }
.ad-info h4 { font-size: 14px; }
.ad-info p { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.ad-reward { color: var(--primary); font-weight: 700; font-size: 16px; }
/* Spin */
.spin-wheel {
  width: 280px; height: 280px; margin: 20px auto; position: relative;
  border-radius: 50%; overflow: hidden; border: 6px solid var(--primary);
}
.spin-segment { position: absolute; width: 100%; height: 100%; clip-path: polygon(50% 50%, 0 0, 100% 0); }
.spin-pointer {
  position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border-left: 16px solid transparent; border-right: 16px solid transparent;
  border-top: 24px solid var(--danger); z-index: 10;
}
/* Referral */
.ref-card {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff; border-radius: var(--radius); padding: 24px; text-align: center; margin-bottom: 12px;
}
.ref-code {
  background: rgba(255,255,255,0.2); border-radius: 10px; padding: 12px; margin: 12px 0;
  font-size: 22px; font-weight: 800; letter-spacing: 4px;
}
.ref-stats { display: flex; gap: 12px; justify-content: center; }
.ref-stat { text-align: center; }
.ref-stat .num { font-size: 24px; font-weight: 800; }
.ref-stat .lbl { font-size: 11px; opacity: 0.7; }
/* Games */
.game-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.game-card {
  background: var(--card); border-radius: var(--radius); padding: 24px 16px; text-align: center;
  border: 1px solid var(--border); cursor: pointer; transition: all 0.15s;
}
.game-card:active { transform: scale(0.96); }
.game-card .icon { font-size: 36px; margin-bottom: 8px; }
.game-card h4 { font-size: 14px; }
.game-card p { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
/* Admin */
.admin-menu { display: flex; flex-direction: column; gap: 8px; }
.admin-item {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  background: var(--card); border-radius: var(--radius-sm); border: 1px solid var(--border);
  cursor: pointer; transition: all 0.15s;
}
.admin-item:active { transform: scale(0.98); }
.admin-item svg { width: 24px; height: 24px; stroke: var(--primary); flex-shrink: 0; }
.admin-item .info { flex: 1; }
.admin-item .info h4 { font-size: 14px; }
.admin-item .info p { font-size: 11px; color: var(--text-secondary); }
.admin-item .arrow { color: var(--text-secondary); font-size: 18px; }
/* Promoted */
.promoted-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0; scroll-snap-type: x mandatory; }
.promoted-scroll::-webkit-scrollbar { display: none; }
.promoted-card {
  min-width: 200px; background: var(--card); border-radius: var(--radius); padding: 14px;
  border: 1px solid var(--border); scroll-snap-align: start;
}
.promoted-card .badge {
  display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 700;
  background: linear-gradient(135deg, #ff6b6b, #ee5a24); color: #fff; margin-bottom: 6px;
}
.promoted-card h4 { font-size: 13px; margin-bottom: 4px; }
.promoted-card p { font-size: 11px; color: var(--text-secondary); }
/* Pulses */
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); display: inline-block; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
/* Toast */
.toast {
  position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 300;
  background: var(--text); color: #fff; padding: 12px 24px; border-radius: var(--radius-sm);
  font-size: 14px; font-weight: 600; opacity: 0; transition: opacity 0.3s; pointer-events: none;
}
.toast.show { opacity: 1; }
/* Profile */
.profile-header {
  display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
}
.profile-header .pfp-lg { width: 72px; height: 72px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover; margin-bottom: 12px; }
.profile-header h2 { font-size: 20px; }
.profile-header .joined { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
</style>
</head>
<body>
<div id="loadingScreen" class="screen active">
  <div class="loader"></div>
  <div style="font-weight:700;color:var(--primary);font-size:18px">TaskHub</div>
  <div id="loadingStatus" style="font-size:13px;color:var(--text-secondary);margin-top:4px">Loading...</div>
</div>



<div id="channelScreen" class="screen">
  <div style="padding:24px 16px;text-align:center">
    <div style="font-size:48px;margin-bottom:12px">📢</div>
    <h2 style="margin-bottom:8px">Join Our Channels</h2>
    <p style="color:var(--text-secondary);margin-bottom:20px;font-size:14px">You need to join all channels to use the app</p>
  </div>
  <div style="flex:1;padding:0 16px">
    <div id="channelList" class="channel-list"></div>
  </div>
  <div style="padding:16px">
    <button class="btn btn-primary btn-block" id="verifyChannels" onclick="checkChannels()">
      Verify & Continue
    </button>
  </div>
</div>

<div id="bonusScreen" class="screen">
  <div style="padding:32px 16px;text-align:center;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center">
    <div style="font-size:64px;margin-bottom:16px">🎁</div>
    <h2 style="margin-bottom:8px">Welcome Bonus!</h2>
    <p style="color:var(--text-secondary);margin-bottom:24px">Claim your first reward to get started</p>
    <div class="bonus-card" style="width:100%;max-width:280px">
      <div class="bonus-amount" id="bonusAmount">₹0</div>
      <div class="sub">Welcome Reward</div>
    </div>
    <button class="btn btn-success btn-block" id="claimBonus" onclick="claimWelcomeBonus()" style="max-width:280px">
      🎁 Claim Bonus
    </button>
  </div>
</div>

<div id="mainScreen" class="screen">
  <div class="app-header" style="background:var(--card)">
    <img class="pfp" id="headerPfp" src="" alt="" style="width:36px;height:36px;border-radius:50%;border:2px solid var(--primary)">
    <div class="user-info">
      <div class="user-name" id="headerName" style="font-size:14px">Loading...</div>
      <div class="user-id" id="headerId" style="font-size:10px">ID: —</div>
    </div>
    <div class="balance-card" id="headerBalance" onclick="navigateTab('Wallet')" style="background:linear-gradient(135deg,var(--success),#00c48c);color:#fff;padding:6px 14px;border-radius:20px;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap">₹0</div>
  </div>
  <div class="tab-content" id="tabContent">
    <div id="tabTasks" class="tab-page active">
      <div id="promotedSection" style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <h3 style="font-size:15px">✨ Promoted</h3>
          <button class="btn btn-sm btn-ghost" onclick="showPromoteModal()">PROMOTE HERE</button>
        </div>
        <div id="promotedList" class="promoted-scroll"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="font-size:15px">🎯 Available Tasks</h3>
        <span id="taskCount" style="font-size:12px;color:var(--text-secondary)"></span>
      </div>
      <div id="taskList"></div>
    </div>
    <div id="tabTop" class="tab-page">
      <div id="topSection"></div>
    </div>
    <div id="tabAdvertise" class="tab-page">
      <div id="advertiseSection"></div>
    </div>
    <div id="tabWallet" class="tab-page">
      <div id="walletSection"></div>
    </div>
    <div id="tabInvite" class="tab-page">
      <div id="inviteSection"></div>
    </div>
    <div id="tabBonus" class="tab-page">
      <div id="dailyBonusSection"></div>
      <div id="spinSection" style="text-align:center;margin-top:16px">
        <h3 style="margin-bottom:4px">🎡 Spin & Win</h3>
        <p style="color:var(--text-secondary);font-size:13px;margin-bottom:8px">Daily free spin</p>
        <div id="spinWheel" class="spin-wheel hidden">
          <div id="spinSegments"></div>
          <div class="spin-pointer"></div>
        </div>
        <button class="btn btn-primary" id="spinBtn" onclick="startSpin()">🎡 Spin Now</button>
      </div>
    </div>
    <div id="tabGames" class="tab-page">
      <div id="gamesSection"></div>
    </div>
    <div id="tabAdmin" class="tab-page">
      <div id="adminSection"></div>
    </div>
  </div>
  <div class="bottom-nav" id="bottomNav"></div>
  <button class="contact-float" onclick="openLink('https://t.me/TeleforgeOfficial')">
    <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
  </button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-content" id="modalContent">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h3 class="modal-title" id="modalTitle" style="margin-bottom:0">Modal</h3>
      <button class="modal-close" onclick="closeModal()" style="position:static;font-size:24px">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
window.onerror = function(msg, src, line, col, err) {
  document.getElementById('loadingScreen').innerHTML = '<div style="text-align:center;padding:20px;font-size:12px;color:var(--danger);word-break:break-all"><b>JS Error:</b><br>' + msg + '<br>Line: ' + line + '</div>';
  return true;
};

let TG = window.Telegram?.WebApp;
let USER = null;
let API_BASE = window.location.origin;
let CURRENT_USER = null;
let NAV_ITEMS = [];

TG?.ready();
TG?.expand();

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }

async function api(path, opts = {}) {
  const timeout = opts.timeout || 10000;
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(API_BASE + path, { headers: { 'Content-Type': 'application/json', ...opts.headers }, ...opts, signal: controller.signal });
    clearTimeout(timer);
    return await res.json();
  } catch(e) {
    clearTimeout(timer);
    if (e.name === 'AbortError') return { ok: false, error: 'Timed out after 10s' };
    return { ok: false, error: 'Network error: ' + e.message };
  }
}

function switchScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

let _initDone = false;

function setLoadingStatus(msg) {
  const el = document.getElementById('loadingStatus');
  if (el) el.textContent = msg;
}

function showError(msg, detail) {
  switchScreen('loadingScreen');
  let html = `<div style="text-align:center;padding:40px"><div style="font-size:48px;margin-bottom:12px">❌</div><h3>${msg}</h3>`;
  if (detail) html += `<p style="font-size:12px;color:var(--text-secondary);word-break:break-word;margin-top:8px">${detail}</p>`;
  html += `<button class="btn btn-primary" style="margin-top:16px" onclick="_initDone=false;init()">Retry</button></div>`;
  document.getElementById('loadingScreen').innerHTML = html;
}

let _init5sTimer = setTimeout(() => {
  if (document.getElementById('loadingScreen').classList.contains('active')) {
    showError('Taking longer than expected...', 'Will retry automatically. Check your connection.');
  }
}, 5000);

async function init() {
  if (_initDone) return;
  _initDone = true;
  clearTimeout(_init5sTimer);

  // Step 1: Check Telegram WebApp
  setLoadingStatus('Checking Telegram...');
  const TG = window.Telegram?.WebApp;
  const initData = TG?.initData || '';
  const user = TG?.initDataUnsafe?.user;

  if (!user) {
    if (!TG) { showError('Not in Telegram', 'Open this from the Telegram bot.'); return; }
    else { showError('No user data', 'Restart Telegram and try again.'); return; }
  }
  USER = user;

  // Step 2: Health check
  setLoadingStatus('Testing connection...');
  var health = await api('/api/health');
  if (!health.ok || health.status !== 'healthy') {
    showError('Backend offline', 'Server not responding. Try again later.');
    return;
  }

  // Step 3: Init API
  setLoadingStatus('Loading your data...');
  var data = await api('/api/app/init?' + new URLSearchParams({ user_id: user.id, init_data: initData, hash: '' }).toString());
  if (!data.ok) {
    showError('Init failed', data.error || 'Unknown server error');
    return;
  }
  CURRENT_USER = data.user;

  // Step 4: Route to correct screen
  if (data.channels_unjoined?.length > 0) {
    switchScreen('channelScreen');
    renderChannels(data.channels_unjoined);
    return;
  }
  if (!data.welcome_bonus_claimed) {
    switchScreen('bonusScreen');
    document.getElementById('bonusAmount').textContent = '₹' + (data.welcome_bonus || 5);
    return;
  }

  // Step 5: Enter app
  enterApp(data);
}

function navigateTab(name) {
  const tabId = name.toLowerCase();
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
  const tab = document.getElementById('tab' + name.charAt(0).toUpperCase() + name.slice(1));
  if (tab) {
    tab.classList.add('active');
    loadTab(name);
  }
}

      <div class="withdraw-opt" onclick="startWithdraw('redeem')">
        <svg viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="14" rx="2"/><path d="M12 2v6"/><path d="M8 2l4 6 4-6"/></svg>
        <h4>Redeem</h4>
        <p>Min ₹50</p>
      </div>
    </div>

    <div id="txnList">${(data.transactions||[]).slice(0,5).map(t => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-size:13px;font-weight:600">${t.description||t.type}</div>
          <div style="font-size:10px;color:var(--text-secondary)">${t.date||''}</div>
        </div>
        <div style="font-weight:700;color:${t.amount > 0 ? 'var(--success)' : 'var(--danger)'}">${t.amount > 0 ? '+' : ''}₹${(t.amount||0).toFixed(2)}</div>
      </div>
    `).join('') || '<div style="text-align:center;padding:16px;color:var(--text-secondary);font-size:13px">No transactions yet</div>'}</div>
  `;
}

function startWithdraw(method) {
  let methods = { upi: 'UPI', stars: 'Telegram Stars', redeem: 'Redeem Code' };
  let html = '';
  if (method === 'upi') {
    html = `
      <div class="form-group"><label>UPI ID</label><input class="form-input" id="wUpi" placeholder="example@upi" value="${CURRENT_USER?.upi||''}"></div>
      <div class="form-group"><label>Amount (₹)</label><input class="form-input" id="wAmount" type="number" placeholder="Min ₹10"></div>
      <button class="btn btn-success btn-block" onclick="submitWithdraw('upi')">Withdraw via UPI</button>
    `;
  } else if (method === 'stars') {
    html = `
      <div class="form-group"><label>Amount (Stars)</label><input class="form-input" id="wStarsAmount" type="number" placeholder="Min 5 Stars"></div>
      <button class="btn btn-success btn-block" onclick="submitWithdraw('stars')">Withdraw via Stars</button>
    `;
  } else if (method === 'redeem') {
    html = `
      <div class="form-group"><label>Amount (₹)</label><input class="form-input" id="wRedeemAmount" type="number" placeholder="Min ₹50"></div>
      <button class="btn btn-success btn-block" onclick="submitWithdraw('redeem')">Request Redeem Code</button>
    `;
  }
  showModal('Withdraw - ' + methods[method], html);
}

async function submitWithdraw(method) {
  let body = { user_id: USER.id, method };
  if (method === 'upi') { body.upi = document.getElementById('wUpi').value; body.amount = parseFloat(document.getElementById('wAmount').value); }
  else if (method === 'stars') { body.amount = parseFloat(document.getElementById('wStarsAmount').value); }
  else if (method === 'redeem') { body.amount = parseFloat(document.getElementById('wRedeemAmount').value); }
  if (!body.amount || body.amount <= 0) { toast('Enter valid amount'); return; }
  const data = await api('/api/app/withdraw', { method: 'POST', body: JSON.stringify(body) });
  if (data.ok) {
    toast('✅ Withdrawal requested!');
    closeModal();
    loadWallet();
  } else { toast(data.error || 'Failed'); }
}
