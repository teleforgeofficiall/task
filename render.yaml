services:
  - type: web
    name: taskhub-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: ENVIRONMENT
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: taskhub-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: taskhub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: taskhub-db
          property: port
      - key: DB_USER
        fromDatabase:
          name: taskhub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: taskhub-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: taskhub-db
          property: database

databases:
  - name: taskhub-db
    plan: free
    region: ohio
    databaseName: taskhub_db
    user: taskhub
